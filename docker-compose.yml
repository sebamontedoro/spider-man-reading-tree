services:
  spider-man:
    build:
      context: .
      dockerfile: Dockerfile
    image: spider-man-reading-tree:latest
    container_name: spider-man-reading-tree
    restart: unless-stopped
    # Override with SPIDERMAN_PORT in the environment or a .env file.
    ports:
      - "${SPIDERMAN_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
