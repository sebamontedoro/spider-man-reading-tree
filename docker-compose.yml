services:
  spider-man:
    build:
      context: .
      dockerfile: Dockerfile
    image: spider-man-reading-tree:latest
    container_name: spider-man-reading-tree
    restart: unless-stopped
    # Joined to the shared proxy network so Caddy can reach it by container
    # name, the way the other services on this host are wired.
    networks:
      - docker-services
    # No host port is published: the proxy on the shared network reaches the
    # container directly by name. Uncomment to expose it on the host as well,
    # e.g. when running without a proxy in front.
    # ports:
    #   - "${SPIDERMAN_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  docker-services:
    # Created by the host's own docker-services stack; we only attach to it.
    external: true
    name: ${SPIDERMAN_NETWORK:-docker-services_default}
