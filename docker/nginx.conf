server {
    # Both families: inside the container `localhost` resolves to ::1 first, so
    # an IPv4-only listener leaves the health check connecting to a closed port.
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The dataset is a large JSON payload inlined into the JS bundle, so
    # compression matters here more than it would for a typical static site.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml image/svg+xml;

    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on old assets.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The comic reader service, on the shared container network.
    #
    # The upstream is held in a variable so nginx resolves it per request
    # rather than at startup: naming a container that is not running is a fatal
    # config error, and the site has to keep serving the reading tree whether
    # or not anyone has mounted a shelf.
    location /api/ {
        resolver              127.0.0.11 valid=30s ipv6=off;
        set $reader           spider-man-reader:8787;
        proxy_pass            http://$reader;
        proxy_http_version    1.1;
        proxy_set_header      Host $host;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        # Pass the ETag and 304s straight through: a page image is immutable
        # for its comic, and re-reading should cost nothing.
        proxy_set_header      If-None-Match $http_if_none_match;
        # A cold rar is unpacked on the first page request.
        proxy_read_timeout    120s;
        # Streaming a 2 MB JPEG through a disk buffer only adds latency.
        proxy_buffering       off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Modest hardening for a page that loads nothing from third parties.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
